name: Set affiliate link on all pages
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-affiliate-links.mjs"
      - ".github/workflows/sync-affiliate.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-affiliate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update all affiliate buttons and URLs
        run: node scripts/sync-affiliate-links.mjs
      - name: Commit synchronized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html' '*.js' '*.mjs'
          if ! git diff --cached --quiet; then
            git commit -m "Fix: use one partner URL on all Ice Fishing pages"
            git push origin HEAD:main
          fi
